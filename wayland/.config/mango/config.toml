[global]
blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 1
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff

border_radius = 15
# no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 1.0

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Overview Setting
hotarea_size = 10
enable_hotarea = 0

# Misc
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
focus_cross_monitor = 0
focus_cross_tag = 0
enable_floating_snap = 1
snap_distance = 30
cursor_size = 24
drag_tile_to_tile = 1
drag_tile_small = 1

xwayland_persistence = 0
xwayland_ignore_scale = 0
allow_shortcuts_inhibit = 0

# Keyboard
repeat_rate = 25
repeat_delay = 600
xkb_rules_layout = "us"

# Trackpad
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
swipe_min_threshold = 1
gesture_live = 0

# Mouse
mouse_natural_scrolling = 0

# Scratchpad setting
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

# Special Settings
special_dim = 0.5

# Auto Start
exec_once = [
  "/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1",
  "vibepanel",
  "wl-paste --type text --watch cliphist -max-items 1000 store",
  "swaybg -m fill -i ~/.cache/currwall"
]

source = [
  './bind.toml'
]

source_optional = [
  './monitor.toml',
  '~/.cache/wal/colors-mangowm.toml',
]
