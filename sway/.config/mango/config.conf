# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 1
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=15
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

xwayland_persistence=0
xwayland_ignore_scale=0
allow_shortcuts_inhibit=0

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
gesture_live=0

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
scratchpadcolor=0x516c93ff


borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:0,layout_name:center_tile
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# layer rule
# layerrule=animation_type_open:zoom,layer_name:rofi
# layerrule=animation_type_close:zoom,layer_name:rofi



# ==============================================================================
# MANGO WM CONFIGURATION
# ==============================================================================

# --- Applications & Custom Commands ---
bind=CTRL+ALT,t,spawn,foot
bind=SUPER,Return,spawn,~/.scripts/tmux_session.sh foot
bind=SUPER+SHIFT,Return,spawn,~/.scripts/rofi-tmuxp.sh foot
bind=SUPER,r,spawn,rofi -modi run -show run
bind=SUPER,space,spawn,rofi -modi drun -show drun
bind=SUPER,n,spawn,nautilus
bind=ALT+CTRL,h,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy -n
bind=SUPER+SHIFT,x,spawn,browser-selector.sh
bind=SUPER+SHIFT,g,spawn,flectar

# --- Utilities & Tools ---
bind=NONE,Print,spawn_shell,grim -g "$(slurp -d)" - | satty --filename -
bind=SUPER+SHIFT,p,spawn,sway-color-picker
bind=SUPER+SHIFT,w,spawn,~/.scripts/random-wallpaper
bind=SUPER+SHIFT,r,spawn,fish -c "/bin/bash -c /home/deve/.scripts/record-screen"
bind=SUPER+SHIFT,s,spawn,~/.scripts/start-scrcpy
bind=SUPER+SHIFT,u,spawn,sway-picgo
bind=SUPER+SHIFT,n,spawn,swaync-client -t -sw

# --- Window & Session Control ---
bind=SUPER+SHIFT,q,killclient
bind=SUPER,o,toggleoverview

bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,e,setkeymode,session


# --- Media & Hardware Keys ---
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +1%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 1%-

# --- Focus Navigation ---
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# --- Window Movement ---
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right

bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# --- Layouts & Window States ---
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,m,zoom

# --- Scratchpad ---
# bind=SUPER+SHIFT,b,minimized
# bind=SUPER,b,toggle_scratchpad

# --- Inline Window Resizing ---
bind=SUPER+CTRL,Left,resizewin,-20,0
bind=SUPER+CTRL,Right,resizewin,20,0
bind=SUPER+CTRL,Up,resizewin,0,-20
bind=SUPER+CTRL,Down,resizewin,0,20

bind=SUPER+CTRL,h,resizewin,-20,0
bind=SUPER+CTRL,l,resizewin,20,0
bind=SUPER+CTRL,k,resizewin,0,-20
bind=SUPER+CTRL,j,resizewin,0,20

# --- Tags (Workspaces 1-9) ---
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,b,toggle_special_tag


bind=SUPER,Tab,focuslast
bind=ALT,Tab,switcher




bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,b,tag_special_tag

# --- Mouse BInding ---

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_right,killclient

# --- Touchpad Gestures ---
gesturebind=swipe:4:right,viewnext_have_client
gesturebind=swipe:4:left,viewprev_have_client
gesturebind=none,down,3,spawn_shell,grim -g "$(slurp -d)" - | satty --filename -
gesturebind=none,up,3,toggleoverview
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview


keymode=session
bind=NONE,e,quit
bind=NONE,s,spawn_shell,systemctl suspend
bind=SHIFT,s,spawn_shell,systemctl poweroff -i
bind=SHIFT,r,spawn_shell,systemctl reboot --firmware-setup
bind=NONE,Escape,setkeymode,default


# --- Auto Start ---
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=vibepanel
exec-once=wl-paste --type text --watch cliphist -max-items 1000 store
exec-once=swaybg -m fill -i ~/.cache/currwall
