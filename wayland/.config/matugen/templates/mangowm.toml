[global]
# Main Colors
root_color = 0x{{colors.surface.default.hex_stripped}}ff
border_color = 0x{{colors.outline_variant.default.hex_stripped}}55
drop_color = 0x{{colors.primary_container.default.hex_stripped}}55
split_color = 0x{{colors.tertiary.default.hex_stripped}}ff
focus_color = 0x{{colors.primary.default.hex_stripped}}ff
urgent_color = 0x{{colors.error.default.hex_stripped}}ff

# State-Specific Colors
maximized_screen_color = 0x{{colors.primary_container.default.hex_stripped}}ff
scratchpad_color = 0x{{colors.secondary_container.default.hex_stripped}}ff
global_color = 0x{{colors.tertiary_container.default.hex_stripped}}ff
overlay_color = 0x{{colors.error_container.default.hex_stripped}}ff

# Group Bar Colors
group_bar_button_color = 0x{{colors.error.default.hex_stripped}}ff
group_bar_decorate_bg_color = 0x{{colors.surface_container_high.default.hex_stripped}}ff
group_bar_decorate_border_color = 0x{{colors.outline.default.hex_stripped}}ff
group_bar_decorate_fg_color = 0x{{colors.on_surface.default.hex_stripped}}ff
group_bar_decorate_focus_bg_color = 0x{{colors.primary.default.hex_stripped}}ff
group_bar_decorate_focus_fg_color = 0x{{colors.on_primary.default.hex_stripped}}ff

# Overview Jump Mode Colors
jump_label_decorate_bg_color = 0x{{colors.surface_container_high.default.hex_stripped}}ff
jump_label_decorate_border_color = 0x{{colors.outline.default.hex_stripped}}ff
jump_label_decorate_fg_color = 0x{{colors.on_surface.default.hex_stripped}}ff
jump_label_decorate_focus_bg_color = 0x{{colors.secondary.default.hex_stripped}}ff
jump_label_decorate_focus_fg_color = 0x{{colors.on_secondary.default.hex_stripped}}ff

# Auto Tab Bar Colors
tab_bar_decorate_bg_color = 0x{{colors.surface_container_low.default.hex_stripped}}ff
tab_bar_decorate_border_color = 0x{{colors.outline_variant.default.hex_stripped}}ff
tab_bar_decorate_fg_color = 0x{{colors.on_surface_variant.default.hex_stripped}}ff
tab_bar_decorate_focus_bg_color = 0x{{colors.secondary_container.default.hex_stripped}}ff
tab_bar_decorate_focus_fg_color = 0x{{colors.on_secondary_container.default.hex_stripped}}ff

# Title Message Bar Colors
title_message_bar_decorate_bg_color = 0x{{colors.surface_container.default.hex_stripped}}ff
title_message_bar_decorate_border_color = 0x{{colors.outline.default.hex_stripped}}ff
title_message_bar_decorate_fg_color = 0x{{colors.on_surface.default.hex_stripped}}ff
title_message_bar_decorate_focus_bg_color = 0x{{colors.primary_container.default.hex_stripped}}ff
title_message_bar_decorate_focus_fg_color = 0x{{colors.on_primary_container.default.hex_stripped}}ff
