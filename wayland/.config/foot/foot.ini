include=~/.cache/wal/colors-foot.ini

[main]
term=xterm-256color
font=JetBrains Mono:size=8,Noto Color Emoji
#font=Hack:size=8,Noto Color Emoji
#font=Iosevka:size=8,Noto Color Emoji
#font=0xProto Nerd Font:size=8,Noto Color Emoji


#font-italic=Victor Mono:style=Italic

pad=12x12 center
# line-height=13
# alpha-mode=matching
# transparent-fullscreen=true
dpi-aware=true

[key-bindings]
clipboard-copy=Mod1+c
clipboard-paste=Mod1+v
show-urls-launch=Mod1+Shift+l
search-start=Mod1+Shift+f
prompt-prev=Mod1+Shift+z
prompt-next=Mod1+Shift+x
spawn-terminal=Mod1+Shift+n

[scrollback]
lines=5000
indicator-position=fixed
indicator-format=percentage

[mouse]
hide-when-typing = no
